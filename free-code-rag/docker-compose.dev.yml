services:
  rag-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8085"
    volumes:
      - ./faiss_store:/app/faiss_store
      - ~/.free-code/knowledgeBase:/root/.free-code/knowledgeBase
    ports:
      - "8085:8085"
    command: python main.py

